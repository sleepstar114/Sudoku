<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Sudoku Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            background-color: #0b0f19;
            color: #f8fafc;
        }

        /* High Contrast Custom Highlight CSS Classes */
        .cell-selected {
            background-color: #2563eb !important; /* Bright Blue 600 */
            color: #ffffff !important;
            box-shadow: inset 0 0 0 2px #93c5fd, 0 0 14px rgba(37, 99, 235, 0.9) !important;
            z-index: 20 !important;
        }
        .cell-same-value {
            background-color: #3730a3 !important; /* Indigo 800 */
            color: #fbbf24 !important; /* Amber 400 */
            font-weight: 900 !important;
            z-index: 10 !important;
        }
        .cell-highlight-area {
            background-color: #374151 !important; /* Slate/Gray 700 - Highly Visible Gray in Dark Mode */
            color: #ffffff !important;
        }
        .cell-base {
            background-color: #0f172a !important; /* Slate 900 */
            color: #cbd5e1 !important;
        }

        /* 3x3 Grid Thicker Borders */
        .border-r-strong { border-right: 3px solid #64748b !important; }
        .border-b-strong { border-bottom: 3px solid #64748b !important; }
        
        /* Shaking Animation for Incorrect Input */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
            box-shadow: inset 0 0 0 2px #ef4444 !important;
        }

        /* Pencil Note Highlight Glow */
        .note-highlight {
            background-color: #d97706 !important; /* Amber 600 */
            color: #ffffff !important;
            border-radius: 2px;
            font-weight: bold;
        }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        // Game State Variables
        let board = Array(9).fill().map(() => Array(9).fill(0));
        let solution = Array(9).fill().map(() => Array(9).fill(0));
        let initialBoard = Array(9).fill().map(() => Array(9).fill(0));
        let notes = Array(9).fill().map(() => Array(9).fill().map(() => new Set()));
        let history = [];
        
        let selectedCells = new Set(); // Stores cell keys like 'r-c'
        let isPencilMode = false;
        let difficulty = 'medium';
        
        let timer = 0;
        let timerInterval = null;
        let isPaused = false;
        
        let score = 0;
        let mistakes = 0;
        let combo = 0;
        let isMouseDown = false;
        let activeStatsTab = 'medium';

        // Web Audio API for feedback cues
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch (e) {}
        }

        // Sudoku Helper Solver (Count Solutions to Ensure 100% Unique Answer)
        function solveSudoku(grid) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) {
                        const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                        for (let num of nums) {
                            if (isValid(grid, r, c, num)) {
                                grid[r][c] = num;
                                if (solveSudoku(grid)) return true;
                                grid[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function countSolutions(grid, count = { val: 0 }) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) {
                        for (let num = 1; num <= 9; num++) {
                            if (isValid(grid, r, c, num)) {
                                grid[r][c] = num;
                                countSolutions(grid, count);
                                grid[r][c] = 0;
                                if (count.val >= 2) return count.val; // Early stop if multiple
                            }
                        }
                        return count.val;
                    }
                }
            }
            count.val++;
            return count.val;
        }

        function isValid(grid, r, c, num) {
            for (let i = 0; i < 9; i++) {
                if (grid[r][i] === num && i !== c) return false;
                if (grid[i][c] === num && i !== r) return false;
            }
            const boxR = Math.floor(r / 3) * 3;
            const boxC = Math.floor(c / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (grid[boxR + i][boxC + j] === num && (boxR + i !== r || boxC + j !== c)) {
                        return false;
                    }
                }
            }
            return true;
        }

        function generatePuzzle() {
            // Fill complete board
            solution = Array(9).fill().map(() => Array(9).fill(0));
            solveSudoku(solution);

            // Copy to working grid
            board = solution.map(row => [...row]);

            // Determine clues count based on difficulty
            let clues = 45;
            if (difficulty === 'easy') clues = 46;
            if (difficulty === 'medium') clues = 36;
            if (difficulty === 'hard') clues = 30;
            if (difficulty === 'expert') clues = 25;

            let removals = 81 - clues;
            let positions = [];
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) positions.push([r, c]);
            }
            positions.sort(() => Math.random() - 0.5);

            // Remove numbers ensuring single unique solution
            for (let pos of positions) {
                if (removals <= 0) break;
                const [r, c] = pos;
                const backup = board[r][c];
                board[r][c] = 0;

                // Check unique solution
                let testGrid = board.map(row => [...row]);
                let count = { val: 0 };
                countSolutions(testGrid, count);

                if (count.val !== 1) {
                    board[r][c] = backup; // Revert if multiple solutions
                } else {
                    removals--;
                }
            }

            initialBoard = board.map(row => [...row]);
            notes = Array(9).fill().map(() => Array(9).fill().map(() => new Set()));
            history = [];
        }

        // Render Sudoku Cells
        function renderBoard() {
            const gridEl = document.getElementById('sudoku-grid');
            gridEl.innerHTML = '';

            let selectedVal = 0;
            let primaryRow = -1, primaryCol = -1;

            if (selectedCells.size > 0) {
                const firstKey = Array.from(selectedCells)[selectedCells.size - 1];
                const [r, c] = firstKey.split('-').map(Number);
                selectedVal = board[r][c];
                primaryRow = r;
                primaryCol = c;
            }

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    const cellId = `${r}-${c}`;
                    
                    // Borders for 3x3 Grid
                    let borderClasses = 'border border-slate-800 flex items-center justify-center relative cursor-pointer font-bold text-xl transition-all duration-150 ';
                    if (c === 2 || c === 5) borderClasses += 'border-r-strong ';
                    if (r === 2 || r === 5) borderClasses += 'border-b-strong ';
                    cell.className = borderClasses;
                    cell.dataset.id = cellId;

                    const isSameRowOrCol = (r === primaryRow || c === primaryCol);
                    const isSameSubgrid = (Math.floor(r / 3) === Math.floor(primaryRow / 3) && Math.floor(c / 3) === Math.floor(primaryCol / 3));
                    const isCellSelected = selectedCells.has(cellId);
                    const cellVal = board[r][c];
                    const isSameValue = selectedVal !== 0 && cellVal === selectedVal;

                    // High Contrast Highlighting System (Pure CSS for guaranteed mobile rendering)
                    cell.classList.remove('cell-selected', 'cell-same-value', 'cell-highlight-area', 'cell-base');

                    if (isCellSelected) {
                        cell.classList.add('cell-selected');
                    } else if (isSameValue) {
                        cell.classList.add('cell-same-value');
                    } else if (primaryRow !== -1 && (isSameRowOrCol || isSameSubgrid)) {
                        cell.classList.add('cell-highlight-area');
                    } else {
                        cell.classList.add('cell-base');
                    }

                    // Value Rendering or Pencil Notes
                    if (cellVal !== 0) {
                        const valSpan = document.createElement('span');
                        valSpan.textContent = cellVal;
                        if (initialBoard[r][c] !== 0) {
                            valSpan.className = 'font-black text-slate-100';
                        } else {
                            valSpan.className = 'font-bold text-indigo-400';
                        }
                        cell.appendChild(valSpan);
                    } else {
                        // Render Pencil Candidates
                        const cellNotes = notes[r][c];
                        if (cellNotes.size > 0) {
                            const noteGrid = document.createElement('div');
                            noteGrid.className = 'grid grid-cols-3 grid-rows-3 w-full h-full p-0.5 text-[9px] text-slate-400 leading-none text-center items-center';
                            for (let n = 1; n <= 9; n++) {
                                const noteItem = document.createElement('div');
                                if (cellNotes.has(n)) {
                                    noteItem.textContent = n;
                                    // Highlight matching pencil note when value is selected
                                    if (selectedVal === n && (isSameRowOrCol || isSameSubgrid)) {
                                        noteItem.classList.add('note-highlight');
                                    }
                                }
                                noteGrid.appendChild(noteItem);
                            }
                            cell.appendChild(noteGrid);
                        }
                    }

                    // Unified Pointer Event Listeners for Mobile Touch & Desktop Click
                    cell.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleCellSelectStart(r, c, e);
                    });
                    
                    cell.addEventListener('pointerenter', (e) => {
                        if (isMouseDown && (e.shiftKey || isPencilMode)) {
                            handleCellSelectHover(r, c, e);
                        }
                    });

                    gridEl.appendChild(cell);
                }
            }

            updateRemainingCounts();
        }

        function handleCellSelectStart(r, c, e) {
            isMouseDown = true;
            const key = `${r}-${c}`;

            if (e && (e.ctrlKey || e.metaKey)) {
                // Ctrl / Cmd Click: Toggle Selection
                if (selectedCells.has(key)) selectedCells.delete(key);
                else selectedCells.add(key);
            } else if (e && e.shiftKey) {
                // Shift Click: Add to Selection
                selectedCells.add(key);
            } else {
                // Default Single Click / Touch Selection
                selectedCells.clear();
                selectedCells.add(key);
            }
            renderBoard();
        }

        function handleCellSelectHover(r, c, e) {
            selectedCells.add(`${r}-${c}`);
            renderBoard();
        }

        window.addEventListener('pointerup', () => { isMouseDown = false; });

        // Touch Drag Multi-selection Support
        document.getElementById('sudoku-grid').addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.dataset && target.dataset.id) {
                    if (isPencilMode) {
                        selectedCells.add(target.dataset.id);
                        renderBoard();
                    }
                }
            }
        }, { passive: true });

        function inputNumber(num) {
            if (selectedCells.size === 0 || isPaused) return;

            saveHistory();

            if (isPencilMode) {
                // Pencil Mode: Process Selected Cells
                let anyAdded = false;
                selectedCells.forEach(key => {
                    const [r, c] = key.split('-').map(Number);
                    if (board[r][c] === 0) {
                        // Check if candidate is valid
                        if (isValid(board, r, c, num)) {
                            if (notes[r][c].has(num)) {
                                notes[r][c].delete(num);
                            } else {
                                notes[r][c].add(num);
                            }
                            anyAdded = true;
                        } else {
                            // Invalid Candidate Warning Animation
                            const cellEl = document.querySelector(`[data-id="${key}"]`);
                            if (cellEl) {
                                cellEl.classList.add('animate-shake');
                                setTimeout(() => cellEl.classList.remove('animate-shake'), 300);
                            }
                            playSound('error');
                        }
                    }
                });
                renderBoard();
                return;
            }

            // Normal Mode: Single Input
            const lastKey = Array.from(selectedCells)[selectedCells.size - 1];
            const [r, c] = lastKey.split('-').map(Number);

            if (initialBoard[r][c] !== 0) return; // Clue cell cannot be edited

            if (solution[r][c] === num) {
                // Correct Number
                board[r][c] = num;
                notes[r][c].clear();
                clearRelatedNotes(r, c, num);

                combo++;
                let addScore = 100 * combo;
                score += addScore;
                document.getElementById('score-val').textContent = score.toLocaleString();

                if (combo > 1) {
                    const badge = document.getElementById('combo-badge');
                    badge.textContent = `${combo}x COMBO`;
                    badge.classList.remove('hidden');
                }

                playSound('success');
                checkVictory();
            } else {
                // Incorrect Number
                mistakes++;
                combo = 0;
                document.getElementById('combo-badge').classList.add('hidden');
                document.getElementById('mistake-count').textContent = mistakes;

                score = Math.max(0, score - 300);
                document.getElementById('score-val').textContent = score.toLocaleString();

                const cellEl = document.querySelector(`[data-id="${lastKey}"]`);
                if (cellEl) {
                    cellEl.classList.add('animate-shake');
                    setTimeout(() => cellEl.classList.remove('animate-shake'), 300);
                }
                playSound('error');

                if (mistakes >= 3) {
                    setTimeout(() => alert('실수 횟수 3회를 초과하였습니다. 다시 도전해보세요!'), 100);
                    startNewGame();
                    return;
                }
            }
            renderBoard();
        }

        function clearRelatedNotes(r, c, num) {
            for (let i = 0; i < 9; i++) {
                notes[r][i].delete(num);
                notes[i][c].delete(num);
            }
            const boxR = Math.floor(r / 3) * 3;
            const boxC = Math.floor(c / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    notes[boxR + i][boxC + j].delete(num);
                }
            }
        }

        function togglePencilMode() {
            isPencilMode = !isPencilMode;
            const badge = document.getElementById('pencil-badge');
            const btn = document.getElementById('pencil-btn');

            if (isPencilMode) {
                badge.textContent = 'ON';
                badge.className = 'absolute top-1 right-1.5 px-1 py-0.2 text-[8px] font-black rounded bg-amber-500 text-slate-950';
                btn.classList.add('border-amber-500/50', 'bg-amber-500/10');
            } else {
                badge.textContent = 'OFF';
                badge.className = 'absolute top-1 right-1.5 px-1 py-0.2 text-[8px] font-black rounded bg-slate-700 text-slate-400';
                btn.classList.remove('border-amber-500/50', 'bg-amber-500/10');
            }
        }

        function autoFillNotes() {
            saveHistory();
            let hasAnyNotes = false;

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0 && notes[r][c].size > 0) {
                        hasAnyNotes = true;
                        break;
                    }
                }
            }

            if (hasAnyNotes) {
                // Clear all notes toggle
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) notes[r][c].clear();
                }
            } else {
                // Fill candidates
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if (board[r][c] === 0) {
                            notes[r][c].clear();
                            for (let num = 1; num <= 9; num++) {
                                if (isValid(board, r, c, num)) {
                                    notes[r][c].add(num);
                                }
                            }
                        }
                    }
                }
            }
            renderBoard();
        }

        function eraseCell() {
            if (selectedCells.size === 0) return;
            saveHistory();

            selectedCells.forEach(key => {
                const [r, c] = key.split('-').map(Number);
                if (initialBoard[r][c] === 0) {
                    board[r][c] = 0;
                    notes[r][c].clear();
                }
            });
            renderBoard();
        }

        function useHint() {
            if (selectedCells.size === 0) return;
            const lastKey = Array.from(selectedCells)[selectedCells.size - 1];
            const [r, c] = lastKey.split('-').map(Number);

            if (board[r][c] !== 0) return;

            saveHistory();
            board[r][c] = solution[r][c];
            notes[r][c].clear();
            clearRelatedNotes(r, c, solution[r][c]);

            score = Math.max(0, score - 200);
            document.getElementById('score-val').textContent = score.toLocaleString();

            renderBoard();
            checkVictory();
        }

        function saveHistory() {
            history.push({
                board: board.map(r => [...r]),
                notes: notes.map(r => r.map(c => new Set(c))),
                score,
                combo
            });
            if (history.length > 20) history.shift();
        }

        function undo() {
            if (history.length === 0) return;
            const lastState = history.pop();
            board = lastState.board;
            notes = lastState.notes;
            score = lastState.score;
            combo = lastState.combo;
            document.getElementById('score-val').textContent = score.toLocaleString();
            renderBoard();
        }

        function updateRemainingCounts() {
            const counts = Array(10).fill(9);
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] !== 0) {
                        counts[board[r][c]]--;
                    }
                }
            }
            for (let i = 1; i <= 9; i++) {
                const countEl = document.getElementById(`count-${i}`);
                if (countEl) {
                    countEl.textContent = counts[i];
                    countEl.className = counts[i] === 0 ? 'text-[10px] font-bold text-slate-700' : 'text-[10px] font-bold text-slate-400 mt-0.5';
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 0;
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timer++;
                    const mins = Math.floor(timer / 60).toString().padStart(2, '0');
                    const secs = (timer % 60).toString().padStart(2, '0');
                    document.getElementById('timer-display').textContent = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const overlay = document.getElementById('pause-overlay');
            const icon = document.getElementById('pause-icon');

            if (isPaused) {
                overlay.classList.remove('hidden');
                icon.className = 'fa-solid fa-play text-lg text-emerald-400';
            } else {
                overlay.classList.add('hidden');
                icon.className = 'fa-solid fa-pause text-lg';
            }
        }

        function confirmRestart() {
            if (confirm('새로운 게임을 시작하시겠습니까? 현재 진행 상황은 초기화됩니다.')) {
                startNewGame();
            }
        }

        function setDifficulty(diff) {
            difficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.className = 'diff-btn py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
            });
            const activeBtn = document.getElementById(`diff-${diff}`);
            if (activeBtn) {
                activeBtn.className = 'diff-btn py-2 text-xs font-bold rounded-xl transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30';
            }
            startNewGame();
        }

        function startNewGame() {
            score = 0;
            mistakes = 0;
            combo = 0;
            selectedCells.clear();
            document.getElementById('score-val').textContent = '0';
            document.getElementById('mistake-count').textContent = '0';
            document.getElementById('combo-badge').classList.add('hidden');

            generatePuzzle();
            renderBoard();
            startTimer();

            saveStatPlayed(difficulty);
        }

        function checkVictory() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] !== solution[r][c]) return;
                }
            }

            clearInterval(timerInterval);
            saveStatVictory(difficulty, score, timer, mistakes);

            const mins = Math.floor(timer / 60).toString().padStart(2, '0');
            const secs = (timer % 60).toString().padStart(2, '0');
            document.getElementById('vic-score').textContent = score.toLocaleString();
            document.getElementById('vic-time').textContent = `${mins}:${secs}`;
            document.getElementById('vic-mistakes').textContent = `${mistakes}/3`;

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            document.getElementById('vic-date').textContent = dateStr;

            document.getElementById('victory-modal').classList.remove('hidden');
        }

        function closeVictoryAndRestart() {
            document.getElementById('victory-modal').classList.add('hidden');
            startNewGame();
        }

        // Stats Storage Logic
        function getStatsData() {
            const data = localStorage.getItem('sudoku_stats');
            return data ? JSON.parse(data) : {
                easy: { played: 0, won: 0, bestScore: 0, bestTime: null, records: [] },
                medium: { played: 0, won: 0, bestScore: 0, bestTime: null, records: [] },
                hard: { played: 0, won: 0, bestScore: 0, bestTime: null, records: [] },
                expert: { played: 0, won: 0, bestScore: 0, bestTime: null, records: [] }
            };
        }

        function saveStatPlayed(diff) {
            const stats = getStatsData();
            stats[diff].played++;
            localStorage.setItem('sudoku_stats', JSON.stringify(stats));
        }

        function saveStatVictory(diff, sc, tm, mst) {
            const stats = getStatsData();
            const curr = stats[diff];
            curr.won++;
            if (sc > curr.bestScore) curr.bestScore = sc;
            if (curr.bestTime === null || tm < curr.bestTime) curr.bestTime = tm;

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            curr.records.unshift({
                score: sc,
                time: tm,
                mistakes: mst,
                date: dateStr
            });
            if (curr.records.length > 10) curr.records.pop();

            localStorage.setItem('sudoku_stats', JSON.stringify(stats));
        }

        function openStatsModal() {
            switchStatsTab(difficulty);
            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        function switchStatsTab(diff) {
            activeStatsTab = diff;
            document.querySelectorAll('.stats-tab').forEach(btn => {
                btn.className = 'stats-tab py-1.5 rounded-lg text-slate-400';
            });
            const activeBtn = document.getElementById(`tab-${diff}`);
            if (activeBtn) activeBtn.className = 'stats-tab py-1.5 rounded-lg bg-indigo-600 text-white';

            const stats = getStatsData()[diff];
            document.getElementById('stat-played').textContent = stats.played;
            document.getElementById('stat-won').textContent = stats.won;
            
            const winrate = stats.played > 0 ? Math.round((stats.won / stats.played) * 100) : 0;
            document.getElementById('stat-winrate').textContent = `${winrate}%`;
            document.getElementById('stat-best-score').textContent = stats.bestScore.toLocaleString();

            if (stats.bestTime !== null) {
                const mins = Math.floor(stats.bestTime / 60).toString().padStart(2, '0');
                const secs = (stats.bestTime % 60).toString().padStart(2, '0');
                document.getElementById('stat-best-time').textContent = `${mins}:${secs}`;
            } else {
                document.getElementById('stat-best-time').textContent = '--:--';
            }

            const recList = document.getElementById('records-list');
            recList.innerHTML = '';

            if (stats.records.length === 0) {
                recList.innerHTML = '<p class="text-slate-500 text-center py-4">성공 기록이 아직 없습니다.</p>';
            } else {
                stats.records.forEach(r => {
                    const mins = Math.floor(r.time / 60).toString().padStart(2, '0');
                    const secs = (r.time % 60).toString().padStart(2, '0');
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-2 rounded-xl bg-slate-950/80 border border-slate-800';
                    item.innerHTML = `
                        <div>
                            <p class="font-bold text-amber-400">+${r.score.toLocaleString()}점</p>
                            <p class="text-[10px] text-slate-500">${r.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-mono text-slate-300 font-semibold">${mins}:${secs}</p>
                            <p class="text-[10px] text-rose-400">실수 ${r.mistakes}/3</p>
                        </div>
                    `;
                    recList.appendChild(item);
                });
            }
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                inputNumber(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                eraseCell();
            } else if (e.key.toLowerCase() === 'm') {
                togglePencilMode();
            }
        });

        // Start Game on Load
        window.onload = function() {
            startNewGame();
        };
    </script>
</body>
</html>
